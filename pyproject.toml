[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayguard"
version = "0.1.0"
description = "Durable signed-webhook relay with retries and dead-letter recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relayguard = "relayguard.__main__:main"

[tool.setuptools.packages.find]
include = ["relayguard*"]
